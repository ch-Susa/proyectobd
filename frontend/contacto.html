<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Tienda — Contáctanos</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="contacto.css" />
</head>

<body>
    <header class="navbar">
        <div class="contenedor nav-contenido">
            <a href="index.html" class="logo">Mi<strong>Tienda</strong></a>

            <nav class="nav-links">
                <a href="index.html">Inicio</a>
                <a href="#productos">Productos</a>
                <a href="contacto.html">Contacto</a>
            </nav>
        </div>
    </header>

    <main class="contenedor" id="inicio">
        <div class="encabezado-principal">
      <h1>Sistema de Gestión de Productos</h1>
      <p>Panel de control conectado a MySQL y Express</p>
        </div>

        <div class="panel-tienda">
            <section class="tarjeta" id="registro">
                <h2 id="tituloFormulario">Contacto</h2>

                <form id="formularioContacto">
                    <input type="hidden" id="mensajeId" value="" />

                    <div class="campo">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" placeholder="Ej: Pepito Pérez" required />
                    </div>

                    <div class="campo">
                        <label for="correo">Correo</label>
                        <input type="email" id="correo" placeholder="Ej: nombre@correo.com" required />
                    </div>

                    <div class="campo">
                        <label for="mensaje">Mensaje</label>
                        <textarea id="mensaje" rows="3" placeholder="Ej: Solicitud técnica" required></textarea>
                    </div>

                    <div class="acciones-form">
                        <button type="submit" id="btnGuardar" class="btn btn-guardar">
                            Enviar Mensaje
                        </button>
                    </div>
                </form>
            </section>
        </div>

        <section class="tarjeta" id="productos">
            <h2>Lista de Mensajes</h2>
            <div id="listaMensajes" class="lista-Mensajes">
                Cargando mensajes...
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="contenedor footer-contenido">
            <p>&copy; 2026 Mi Tienda — Proyecto Formativo con Node.js, Express y MySQL.</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>

</html>
